components:
  schemas:
    AccountResponse:
      required:
        - userId
        - email
        - timeZoneId
        - createdAt
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        timeZoneId:
          type: string
        createdAt:
          type: string
          format: date-time
    ActivityEntryResponse:
      required:
        - id
        - kind
        - occurredAt
        - fromStage
        - toStage
        - transitionKind
        - note
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ActivityKind'
        occurredAt:
          type: string
          format: date-time
        fromStage:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Stage'
        toStage:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Stage'
        transitionKind:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/TransitionKind'
        note:
          type:
            - 'null'
            - string
    ActivityKind:
      enum:
        - Created
        - StageChanged
        - Note
    AddNoteRequest:
      required:
        - note
      type: object
      properties:
        note:
          type:
            - 'null'
            - string
    AnalyticsInsightsResponse:
      required:
        - funnel
        - rates
        - timing
        - trend
        - breakdowns
      type: object
      properties:
        funnel:
          $ref: '#/components/schemas/FunnelResponse'
        rates:
          $ref: '#/components/schemas/RatesResponse'
        timing:
          $ref: '#/components/schemas/TimingResponse'
        trend:
          type: array
          items:
            $ref: '#/components/schemas/TrendPoint'
        breakdowns:
          $ref: '#/components/schemas/BreakdownsResponse'
    AnalyticsOverviewResponse:
      required:
        - totalApplied
        - pipeline
      type: object
      properties:
        totalApplied:
          type: integer
          format: int32
        pipeline:
          type: array
          items:
            $ref: '#/components/schemas/PipelineStageCount'
    ApplicationResponse:
      required:
        - id
        - campaignId
        - companyId
        - stage
        - role
        - compensation
        - location
        - workMode
        - postingUrl
        - source
        - appliedDate
        - applicationDeadline
        - offerDecisionDeadline
        - cvLabel
        - coverLetterLabel
        - customFields
        - createdAt
        - updatedAt
      type: object
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        companyId:
          type:
            - 'null'
            - string
          format: uuid
        stage:
          $ref: '#/components/schemas/Stage'
        role:
          type: string
        compensation:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/MoneyResponse'
        location:
          type:
            - 'null'
            - string
        workMode:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/WorkMode'
        postingUrl:
          type:
            - 'null'
            - string
        source:
          type:
            - 'null'
            - string
        appliedDate:
          type: string
          format: date
        applicationDeadline:
          type:
            - 'null'
            - string
          format: date
        offerDecisionDeadline:
          type:
            - 'null'
            - string
          format: date
        cvLabel:
          type:
            - 'null'
            - string
        coverLetterLabel:
          type:
            - 'null'
            - string
        customFields:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type:
            - 'null'
            - string
          format: date-time
    ApplicationSummaryResponse:
      required:
        - id
        - campaignId
        - companyId
        - stage
        - role
        - workMode
        - appliedDate
        - applicationDeadline
        - createdAt
        - updatedAt
      type: object
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        companyId:
          type:
            - 'null'
            - string
          format: uuid
        stage:
          $ref: '#/components/schemas/Stage'
        role:
          type: string
        workMode:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/WorkMode'
        appliedDate:
          type: string
          format: date
        applicationDeadline:
          type:
            - 'null'
            - string
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type:
            - 'null'
            - string
          format: date-time
    AuthTokensResponse:
      required:
