              $ref: '#/components/schemas/LogoutRequest'
        required: true
      responses:
        '204':
          description: No Content
  /api/v1/identity/logout-all:
    post:
      tags:
        - identity
      responses:
        '204':
          description: No Content
      security:
        - bearer: [ ]
  /api/v1/account:
    get:
      tags:
        - account
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
      security:
        - bearer: [ ]
    put:
      tags:
        - account
      requestBody:
        content:
          application/json:
            schema:
