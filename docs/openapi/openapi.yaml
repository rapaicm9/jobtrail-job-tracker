openapi: '3.1.1'
info:
  title: Jobspect API
  description: 'Job-application tracking: applications and their pipeline, the companies, contacts and interviews around them, reminders, and the analytics over the lot. Every route is scoped to the calling account - a resource owned by another user is reported as absent, not as forbidden.'
  version: '1'
paths:
  /api/v1/identity/register:
    post:
      tags:
        - identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
  /api/v1/identity/login:
    post:
      tags:
        - identity
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensResponse'
  /api/v1/identity/refresh:
