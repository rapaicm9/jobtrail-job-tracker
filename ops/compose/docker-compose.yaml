services:
  jobspect-compose-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest"
    ports:
      - "18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  postgres:
    image: "docker.io/library/postgres:18.3"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    expose:
      - "5432"
    volumes:
      - type: "volume"
        target: "/var/lib/postgresql"
        source: "jobspect.apphost-7884ad5822-postgres-data"
        read_only: false
    networks:
      - "aspire"
  cache:
    image: "docker.io/library/redis:8.6"
    command:
      - "-c"
      - "redis-server --requirepass $$REDIS_PASSWORD"
    entrypoint:
      - "/bin/sh"
    environment:
      REDIS_PASSWORD: "${CACHE_PASSWORD}"
    expose:
      - "6379"
    networks:
      - "aspire"
  migrations:
    image: "${MIGRATIONS_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ConnectionStrings__jobspect: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=jobspect"
      JOBSPECT_HOST: "postgres"
      JOBSPECT_PORT: "5432"
      JOBSPECT_USERNAME: "postgres"
      JOBSPECT_PASSWORD: "${POSTGRES_PASSWORD}"
      JOBSPECT_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/jobspect"
      JOBSPECT_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/jobspect"
      JOBSPECT_DATABASENAME: "jobspect"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jobspect-compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "migrations"
    depends_on:
      postgres:
        condition: "service_started"
    networks:
      - "aspire"
  api:
    image: "${API_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${API_PORT}"
      ConnectionStrings__jobspect: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=jobspect"
      JOBSPECT_HOST: "postgres"
      JOBSPECT_PORT: "5432"
      JOBSPECT_USERNAME: "postgres"
      JOBSPECT_PASSWORD: "${POSTGRES_PASSWORD}"
      JOBSPECT_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/jobspect"
      JOBSPECT_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/jobspect"
      JOBSPECT_DATABASENAME: "jobspect"
      ConnectionStrings__cache: "cache:6379,password=${CACHE_PASSWORD}"
      CACHE_HOST: "cache"
      CACHE_PORT: "6379"
      CACHE_PASSWORD: "${CACHE_PASSWORD}"
      CACHE_URI: "redis://:${CACHE_PASSWORD}@cache:6379"
      Identity__Jwt__PrivateKeyPem: "${IDENTITY_JWT_PRIVATE_KEY}"
      Identity__Jwt__PublicKeyPem: "${IDENTITY_JWT_PUBLIC_KEY}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jobspect-compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "api"
    expose:
      - "${API_PORT}"
    depends_on:
      migrations:
        condition: "service_completed_successfully"
      cache:
        condition: "service_started"
    networks:
      - "aspire"
  worker:
    image: "${WORKER_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ConnectionStrings__jobspect: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=jobspect"
      JOBSPECT_HOST: "postgres"
      JOBSPECT_PORT: "5432"
      JOBSPECT_USERNAME: "postgres"
      JOBSPECT_PASSWORD: "${POSTGRES_PASSWORD}"
      JOBSPECT_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/jobspect"
      JOBSPECT_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/jobspect"
      JOBSPECT_DATABASENAME: "jobspect"
      ConnectionStrings__cache: "cache:6379,password=${CACHE_PASSWORD}"
      CACHE_HOST: "cache"
      CACHE_PORT: "6379"
      CACHE_PASSWORD: "${CACHE_PASSWORD}"
      CACHE_URI: "redis://:${CACHE_PASSWORD}@cache:6379"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jobspect-compose-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "worker"
    depends_on:
      migrations:
        condition: "service_completed_successfully"
      cache:
        condition: "service_started"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
volumes:
  jobspect.apphost-7884ad5822-postgres-data:
    driver: "local"
